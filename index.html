<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Playlist Picker</title>
<style>
:root {
  --bg:#f6f6f4; --card:#fff; --text:#161616; --muted:#6f6f6a;
  --border:#deded8; --chip:#efefeb; --selected:#1d1d1b; --selectedText:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
}
main { max-width:760px; margin:0 auto; padding:18px 14px 44px; }
h1 { font-size:28px; margin:4px 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
.section {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:14px; margin:0 0 12px;
}
.section h2 { font-size:15px; margin:0 0 10px; }
.autogrid, .optional-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
select {
  width:100%; appearance:none; border:1px solid var(--border); background:white;
  border-radius:12px; padding:11px 12px; font-size:15px; color:var(--text);
}
.actions { display:flex; gap:8px; margin-top:10px; }
button.small {
  border:1px solid var(--border); background:white; border-radius:10px;
  padding:8px 10px; font-size:13px;
}
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip {
  border:1px solid var(--border); background:var(--chip); color:var(--text);
  border-radius:999px; padding:8px 11px; font-size:14px; line-height:1;
  cursor:pointer; user-select:none;
}
.chip.selected { background:var(--selected); color:var(--selectedText); border-color:var(--selected); }
.chip .count { opacity:.6; font-size:12px; margin-left:4px; }
.logic { color:var(--muted); font-size:12px; margin:0 0 10px; }
.results-head {
  display:flex; justify-content:space-between; align-items:end; gap:12px;
  margin:20px 2px 10px;
}
.results-head h2 { margin:0; font-size:18px; }
.sort-wrap { width:145px; }
.sort-wrap select { padding:8px 10px; font-size:13px; }
.cards {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
}
.card {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  overflow:hidden; text-decoration:none; color:inherit; display:block;
}
.cover {
  width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#e7e7e2;
}
.no-cover {
  width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  color:var(--muted); background:#e7e7e2; font-size:12px;
}
.card-body { padding:10px; }
.name { font-weight:700; font-size:16px; margin-bottom:7px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; }
.tag {
  background:var(--chip); border-radius:999px; padding:5px 7px;
  font-size:11px; color:#454541;
}
.spotify {
  display:inline-block; margin-top:10px; font-size:13px; font-weight:650;
}
.spotify.missing { color:var(--muted); font-weight:500; }
.empty {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:24px; color:var(--muted); text-align:center; grid-column:1/-1;
}
@media (min-width:650px) {
  .cards { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .optional-grid { grid-template-columns:repeat(3,1fr); }
}

details.time-section {
  padding:0;
}
details.time-section summary {
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
}
details.time-section summary::-webkit-details-marker { display:none; }
details.time-section summary::after {
  content:"›";
  font-size:22px;
  line-height:1;
  transform:rotate(90deg);
  transition:transform .18s ease;
  color:var(--muted);
}
details.time-section[open] summary::after {
  transform:rotate(-90deg);
}
.time-summary {
  margin-left:auto;
  font-weight:500;
  color:var(--muted);
  font-size:13px;
}
.time-content {
  padding:0 14px 14px;
}

</style>
</head>
<body>
<main>
  <h1>playlist picker</h1>
  
  
  <details class="section time-section">
    <summary>
      <span>Time</span>
      <span class="time-summary" id="timeSummary"></span>
    </summary>
    <div class="time-content">
      <div class="autogrid">
        <div>
          <label for="season">Season</label>
          <select id="season">
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="fall">Fall</option>
            <option value="winter">Winter</option>
          </select>
        </div>
        <div>
          <label for="timeofday">Time of day</label>
          <select id="timeofday">
            <option value="early">Early</option>
            <option value="noon">Noon</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
            <option value="night">Night</option>
          </select>
        </div>
      </div>
      <div class="actions"><button class="small" id="useNow">Use current date & time</button></div>
    </div>
  </details>

  <section class="section">
    <h2>Setting</h2>
    <div class="optional-grid" id="settingFilters"></div>
  </section>

  <section class="section">
    <h2>Group dynamics</h2>
    <div class="optional-grid" id="groupFilters"></div>
  </section>


  <section class="section">
    <h2>Genres</h2>
    <div class="logic">Select multiple if you want. A playlist must contain <b>all</b> selected genres.</div>
    <div class="chips" id="genreChips"></div>
  </section>

  <section class="section">
    <h2>Moods</h2>
    <div class="logic">Only moods available after the filters above are shown. Multiple moods use <b>OR</b>.</div>
    <div class="chips" id="moodChips"></div>
  </section>

  <div class="results-head">
    <h2><span id="resultCount">0</span> playlists</h2>
    <div class="sort-wrap">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="best">Best match</option>
        <option value="az">Name A–Z</option>
      </select>
    </div>
  </div>
  <div class="cards" id="results"></div>
</main>

const ALL_MOODS = [...new Set(playlists.flatMap(p => p["mood"]))].sort();
const ALL_GENRES = [...new Set(playlists.flatMap(p => p["genres"]))].sort();
const settingFields = [
  ["location","Location"],
  ["attention demand","Attention demand"]
];

const groupFields = [
  ["audience","Audience"],
  ["social safety","Social safety"],
  ["age range","Age range"]
];

const optionalFields = [...settingFields, ...groupFields];

const selectedGenres = new Set();
const selectedMoods = new Set();
const optionalState = {};

function titleCase(s) {
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

function seasonNow(d=new Date()) {
  const m = d.getMonth()+1;
  if ([12,1,2].includes(m)) return "winter";
  if ([3,4,5].includes(m)) return "spring";
  if ([6,7,8].includes(m)) return "summer";
  return "fall";
}

function timeNow(d=new Date()) {
  const h = d.getHours();
  if (h >= 5 && h < 11) return "early";
  if (h >= 11 && h < 14) return "noon";
  if (h >= 14 && h < 17) return "afternoon";
  if (h >= 17 && h < 21) return "evening";
  return "night";
}

function applyNow() {
  document.getElementById("season").value = seasonNow();
  document.getElementById("timeofday").value = timeNow();
  update();
}

function passesBase(p) {
  const season = document.getElementById("season").value;
  const tod = document.getElementById("timeofday").value;
  if (!p["season"].includes(season)) return false;
  if (!p["time of day"].includes(tod)) return false;
  for (const [field] of optionalFields) {
    const v = optionalState[field];
    if (v && !p[field].includes(v)) return false;
  }
  return true;
}

function passesGenres(p, extraGenre=null) {
  const required = new Set(selectedGenres);
  if (extraGenre) required.add(extraGenre);
  for (const g of required) if (!p["genres"].includes(g)) return false;
  return true;
}

function passesMoods(p) {
  if (selectedMoods.size === 0) return true;
  return [...selectedMoods].some(m => p["mood"].includes(m));
}

function resultRecords() {
  return playlists.filter(p => passesBase(p) && passesGenres(p) && passesMoods(p));
}

function addFilterGroup(containerId, fields) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  for (const [field,label] of fields) {
    const vals = [...new Set(playlists.flatMap(p => p[field]))].sort();
    const wrap = document.createElement("div");
    const lab = document.createElement("label");
    lab.textContent = label;
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">Any</option>` + vals.map(v => `<option value="${v}">${titleCase(v)}</option>`).join("");
    sel.addEventListener("change", () => { optionalState[field] = sel.value; update(); });
    wrap.append(lab, sel);
    box.appendChild(wrap);
  }
}

function buildOptionalFilters() {
  addFilterGroup("settingFilters", settingFields);
  addFilterGroup("groupFilters", groupFields);
}

function renderGenres() {
  const container = document.getElementById("genreChips");
  container.innerHTML = "";
  for (const g of ALL_GENRES) {
    // Genre availability responds to current moods + all currently selected genres.
    const count = playlists.filter(p =>
      passesBase(p) &&
      passesMoods(p) &&
      passesGenres(p, selectedGenres.has(g) ? null : g)
    ).length;
    if (count === 0 && !selectedGenres.has(g)) continue;

    const b = document.createElement("button");
    b.className = "chip" + (selectedGenres.has(g) ? " selected" : "");
    b.innerHTML = `${titleCase(g)} <span class="count">${count}</span>`;
    b.onclick = () => {
      selectedGenres.has(g) ? selectedGenres.delete(g) : selectedGenres.add(g);
      update();
    };
    container.appendChild(b);
  }
}

function renderMoods() {
  const container = document.getElementById("moodChips");
  container.innerHTML = "";

  // With OR mood logic, available moods are derived from base + genre filters.
  // Existing mood selections remain visible so they can always be deselected.
  for (const m of ALL_MOODS) {
    const count = playlists.filter(p =>
      passesBase(p) && passesGenres(p) && p["mood"].includes(m)
    ).length;
    if (count === 0 && !selectedMoods.has(m)) continue;

    const b = document.createElement("button");
    b.className = "chip" + (selectedMoods.has(m) ? " selected" : "");
    b.innerHTML = `${titleCase(m)} <span class="count">${count}</span>`;
    b.onclick = () => {
      selectedMoods.has(m) ? selectedMoods.delete(m) : selectedMoods.add(m);
      update();
    };
    container.appendChild(b);
  }
}

function renderResults() {
  let rows = resultRecords();
  const sort = document.getElementById("sort").value;

  if (sort === "az") {
    rows.sort((a,b) => a.name.localeCompare(b.name));
  } else {
    rows.sort((a,b) => {
      const am = [...selectedMoods].filter(m => a["mood"].includes(m)).length;
      const bm = [...selectedMoods].filter(m => b["mood"].includes(m)).length;
      if (bm !== am) return bm - am;
      return a.name.localeCompare(b.name);
    });
  }

  document.getElementById("resultCount").textContent = rows.length;
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No playlists match this combination. Remove a filter or genre.</div>`;
    return;
  }

  for (const p of rows) {
    const el = document.createElement(p.spotify ? "a" : "div");
    el.className = "card";
    if (p.spotify) {
      el.href = p.spotify;
      el.target = "_blank";
      el.rel = "noopener";
    }

    const img = p.cover
      ? `<img class="cover" src="${p.cover}" alt="" loading="lazy">`
      : `<div class="no-cover">No cover</div>`;

    const moodTags = p["mood"].map(m => `<span class="tag">${titleCase(m)}</span>`).join("");
    const spotify = p.spotify
      ? `<div class="spotify">Open in Spotify →</div>`
      : `<div class="spotify missing">Spotify link not added yet</div>`;

    el.innerHTML = `${img}<div class="card-body">
      <div class="name">${p.name}</div>
      <div class="tags">${moodTags}</div>
      ${spotify}
    </div>`;
    container.appendChild(el);
  }
}

function updateTimeSummary() {
  const season = document.getElementById("season").value;
  const tod = document.getElementById("timeofday").value;
  document.getElementById("timeSummary").textContent =
    `${titleCase(season)} · ${titleCase(tod)}`;
}

function update() {
  updateTimeSummary();
  renderMoods();
  renderGenres();   // Re-render again because current moods affect genre availability.
  renderResults();
}

document.getElementById("season").addEventListener("change", update);
document.getElementById("timeofday").addEventListener("change", update);
document.getElementById("sort").addEventListener("change", renderResults);
document.getElementById("useNow").addEventListener("click", applyNow);

buildOptionalFilters();
applyNow();
</script>
</body>
</html>

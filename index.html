<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Playlist Picker</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2238%22%20fill%3D%22%236f8798%22/%3E%3Ctext%20x%3D%2290%22%20y%3D%22122%22%20text-anchor%3D%22middle%22%20font-size%3D%22105%22%20font-family%3D%22Arial%2Csans-serif%22%20fill%3D%22white%22%3E%E2%99%AA%3C/text%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2238%22%20fill%3D%22%236f8798%22/%3E%3Ctext%20x%3D%2290%22%20y%3D%22122%22%20text-anchor%3D%22middle%22%20font-size%3D%22105%22%20font-family%3D%22Arial%2Csans-serif%22%20fill%3D%22white%22%3E%E2%99%AA%3C/text%3E%3C/svg%3E"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg:#eef6fb; --card:#ffffff; --text:#1a2530; --muted:#6f7f8c;
  --border:#d6e1e8; --chip:#f3f7fa; --selected:#2e4353; --selectedText:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
}
main { max-width:760px; margin:0 auto; padding:18px 14px 44px; }
h1 { font-size:28px; margin:4px 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
.section {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:14px; margin:0 0 12px;
}
.section h2 { font-size:15px; margin:0 0 10px; }
.autogrid, .optional-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
select {
  width:100%; appearance:none; border:1px solid var(--border); background:white;
  border-radius:12px; padding:11px 12px; font-size:15px; color:var(--text);
}
.actions { display:flex; gap:8px; margin-top:10px; }
button.small {
  border:1px solid var(--border); background:white; border-radius:10px;
  padding:8px 10px; font-size:13px;
}
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip {
  border:1px solid var(--border); background:var(--chip); color:var(--text);
  border-radius:999px; padding:8px 11px; font-size:14px; line-height:1;
  cursor:pointer; user-select:none;
}
.chip.selected { background:var(--selected); color:var(--selectedText); border-color:var(--selected); }
.chip .count { opacity:.6; font-size:12px; margin-left:4px; }
.logic { color:var(--muted); font-size:12px; margin:0 0 10px; }
.results-head {
  display:flex; justify-content:space-between; align-items:end; gap:12px;
  margin:20px 2px 10px;
}
.results-head h2 { margin:0; font-size:18px; }
.sort-wrap { width:145px; }
.sort-wrap select { padding:8px 10px; font-size:13px; }
.cards {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
}
.card {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  overflow:hidden; text-decoration:none; color:inherit; display:block;
}
.cover {
  width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#e7e7e2;
}
.no-cover {
  width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  color:var(--muted); background:#e7e7e2; font-size:12px;
}
.card-body { padding:10px; }
.name { font-weight:700; font-size:16px; margin-bottom:7px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; }
.tag {
  background:var(--chip); border-radius:999px; padding:5px 7px;
  font-size:11px; color:#454541;
}
.spotify {
  display:inline-block; margin-top:10px; font-size:13px; font-weight:650;
}
.spotify.missing { color:var(--muted); font-weight:500; }
.empty {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:24px; color:var(--muted); text-align:center; grid-column:1/-1;
}
@media (min-width:650px) {
  .cards { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .optional-grid { grid-template-columns:repeat(3,1fr); }
}

details.time-section {
  padding:0;
}
details.time-section summary {
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
}
details.time-section summary::-webkit-details-marker { display:none; }
details.time-section summary::after {
  content:"›";
  font-size:22px;
  line-height:1;
  transform:rotate(90deg);
  transition:transform .18s ease;
  color:var(--muted);
}
details.time-section[open] summary::after {
  transform:rotate(-90deg);
}
.time-summary {
  margin-left:auto;
  font-weight:500;
  color:var(--muted);
  font-size:13px;
}
.time-content {
  padding:0 14px 14px;
}


.people-toggle-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:4px;
  font-size:14px;
}
.toggle-group {
  display:flex;
  gap:6px;
}
.toggle-btn {
  border:1px solid var(--border);
  background:#f5f8fb;
  color:var(--text);
  border-radius:999px;
  padding:8px 13px;
  font-size:13px;
  cursor:pointer;
}
.toggle-btn.selected {
  background:#2e4353;
  color:#fff;
  border-color:#2e4353;
}
.group-hidden {
  display:none;
  margin-top:12px;
}
.group-visible {
  display:block;
  margin-top:12px;
}


.weather-preview {
  margin-top:10px;
}
.preview-note {
  font-size:10px;
  font-weight:500;
  color:var(--muted);
  margin-left:4px;
}

</style>
</head>
<body>
<main>
  <h1>♪ playlist picker</h1>
  
  
  <details class="section time-section">
    <summary>
      <span>When</span>
      <span class="time-summary" id="timeSummary"></span>
    </summary>
    <div class="time-content">
      <div class="autogrid">
        <div>
          <label>Season</label>
          <div class="chips" id="seasonChips"></div>
        </div>
        <div>
          <label for="timeofday">Time of day</label>
          <select id="timeofday">
            <option value="early">Early</option>
            <option value="noon">Noon</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
            <option value="night">Night</option>
          </select>
        </div>
      </div>
      <div class="actions"><button class="small" id="useNow">Use current date & time</button></div>
    </div>
  </details>

  <section class="section">
    <h2>Where</h2>
    <div class="optional-grid" id="settingFilters"></div>
    <div class="weather-preview">
      <label for="weatherNow">Weather <span class="preview-note">preview</span></label>
      <select id="weatherNow">
        <option value="">Detecting…</option>
        <option value="sunny">Sunny</option>
        <option value="cloudy">Cloudy</option>
        <option value="rain">Rainy</option>
        <option value="snow">Snowy</option>
      </select>
    </div>
  </section>

  <section class="section">
    <h2>Who</h2>
    <div class="people-toggle-row">
      <span>With people?</span>
      <div class="toggle-group" id="peopleToggle">
        <button type="button" class="toggle-btn selected" data-value="no">No</button>
        <button type="button" class="toggle-btn" data-value="yes">Yes</button>
      </div>
    </div>
    <div id="groupFiltersWrap" class="group-hidden">
      <div class="optional-grid" id="groupFilters"></div>
    </div>
  </section>


  <section class="section">
    <h2>Genres</h2>
    <div class="logic">Select multiple if you want. A playlist must contain <b>all</b> selected genres.</div>
    <div class="chips" id="genreChips"></div>
  </section>

  <section class="section">
    <h2>Moods</h2>
    <div class="logic">Only moods available after the filters above are shown. Multiple moods use <b>OR</b>.</div>
    <div class="chips" id="moodChips"></div>
  </section>

  <div class="results-head">
    <h2><span id="resultCount">0</span> playlists</h2>
    <div class="sort-wrap">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="best">Best match</option>
        <option value="az">Name A–Z</option>
      </select>
    </div>
  </div>
  <div class="cards" id="results"></div>
</main>

function colorForTag(value) {
  const key = String(value).toLowerCase();
  if (tagColors[key]) return tagColors[key];
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash) + key.charCodeAt(i);
  const hue = Math.abs(hash) % 360;
  return [`hsl(${hue} 28% 82%)`, `hsl(${hue} 26% 28%)`];
}
function applyTagColor(el, value, selected=false) {
  const [bg, fg] = colorForTag(value);
  el.style.background = selected ? fg : bg;
  el.style.color = selected ? "#fff" : fg;
  el.style.borderColor = selected ? fg : bg;
}

const colorGroups = {
  pink: 0,
  red: 1,
  orange: 2,
  yellow: 3,
  green: 4,
  blue: 5,
  purple: 6,
  gray: 7
};

const tagColorGroup = {
  "electronic":"pink","chaotic":"pink","stylish":"pink","playful":"pink","sexy":"pink",
  "romantic":"red","bold":"red","passionate":"red","confident":"red",
  "folk":"orange","cozy":"orange","retro":"orange","warm":"orange",
  "jazz":"yellow","sunny":"yellow","happy":"yellow","golden":"yellow","chill":"yellow","nostalgic":"yellow",
  "indie":"green","tropical":"green","acoustic":"green","earthy":"green","fresh":"green","nature":"green",
  "classical":"blue","dreamy":"blue","atmospheric":"blue","calm":"blue","peaceful":"blue","soft":"blue",
  "expansive":"blue","comforting":"blue","soothing":"blue","carefree":"blue","relaxed":"blue","social":"blue",
  "hip hop":"purple","hip-hop":"purple","moody":"purple","mysterious":"purple","cinematic":"purple",
  "vibrant":"purple","vulnerable":"purple","wistful":"purple",
  "edgy":"gray","rock":"gray","metal":"gray","intense":"gray","sad":"gray","melancholic":"gray","dark":"gray"
};

function colorRank(tag) {
  const group = tagColorGroup[String(tag).toLowerCase()];
  if (group) return colorGroups[group];

  // Unknown tags still get a stable rainbow position from their fallback hue.
  let hash = 0;
  const key = String(tag).toLowerCase();
  for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash) + key.charCodeAt(i);
  const hue = Math.abs(hash) % 360;

  if (hue >= 330 || hue < 15) return colorGroups.red;
  if (hue < 45) return colorGroups.orange;
  if (hue < 75) return colorGroups.yellow;
  if (hue < 165) return colorGroups.green;
  if (hue < 255) return colorGroups.blue;
  if (hue < 330) return colorGroups.purple;
  return colorGroups.gray;
}

function sortByColorWheel(values) {
  return [...values].sort((a,b) => {
    const rankDiff = colorRank(a) - colorRank(b);
    if (rankDiff !== 0) return rankDiff;
    return a.localeCompare(b);
  });
}



function seasonNow(d=new Date()) {
  const m = d.getMonth() + 1;

  // Transition months include both adjacent seasons.
  if (m === 12) return ["fall", "winter"];
  if (m === 3) return ["winter", "spring"];
  if (m === 6) return ["spring", "summer"];
  if (m === 9) return ["summer", "fall"];

  if (m === 1 || m === 2) return ["winter"];
  if (m === 4 || m === 5) return ["spring"];
  if (m === 7 || m === 8) return ["summer"];
  return ["fall"]; // Oct, Nov
}

let sunsetMinutes = null;

function normalizeDegrees(x) {
  return ((x % 360) + 360) % 360;
}

function sunsetLocalMinutes(date, lat, lon) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const dayOfYear = Math.floor(diff / 86400000);

  const lngHour = lon / 15;
  const t = dayOfYear + ((18 - lngHour) / 24);

  const M = (0.9856 * t) - 3.289;
  let L = M + (1.916 * Math.sin(M * Math.PI / 180))
            + (0.020 * Math.sin(2 * M * Math.PI / 180))
            + 282.634;
  L = normalizeDegrees(L);

  let RA = Math.atan(0.91764 * Math.tan(L * Math.PI / 180)) * 180 / Math.PI;
  RA = normalizeDegrees(RA);

  const Lquadrant  = Math.floor(L / 90) * 90;
  const RAquadrant = Math.floor(RA / 90) * 90;
  RA += (Lquadrant - RAquadrant);
  RA /= 15;

  const sinDec = 0.39782 * Math.sin(L * Math.PI / 180);
  const cosDec = Math.cos(Math.asin(sinDec));

  const cosH = (
    Math.cos(90.833 * Math.PI / 180) -
    (sinDec * Math.sin(lat * Math.PI / 180))
  ) / (cosDec * Math.cos(lat * Math.PI / 180));

  if (cosH < -1 || cosH > 1) return null;

  let H = Math.acos(cosH) * 180 / Math.PI;
  H /= 15;

  const T = H + RA - (0.06571 * t) - 6.622;
  let UT = T - lngHour;
  UT = ((UT % 24) + 24) % 24;

  const offsetHours = -date.getTimezoneOffset() / 60;
  let localHour = UT + offsetHours;
  localHour = ((localHour % 24) + 24) % 24;

  return localHour * 60;
}

function timeNow(d=new Date()) {
  const mins = d.getHours() * 60 + d.getMinutes();

  // Fixed morning/noon boundaries:
  // Night: midnight–04:59
  // Early: 05:00–09:59
  // Noon: 10:00–13:59
  if (mins < 300) return "night";
  if (mins < 600) return "early";
  if (mins < 840) return "noon";

  // If location/sunset is unavailable, keep a sensible fallback.
  if (sunsetMinutes === null) {
    if (mins < 1020) return "afternoon"; // 14:00–16:59
    if (mins < 1260) return "evening";   // 17:00–20:59
    return "night";
  }

  // Afternoon starts at 14:00 and always lasts at least 1 hour.
  // Evening normally begins 2 hours before sunset, but never before 15:00.
  const eveningStart = Math.max(900, sunsetMinutes - 120);

  // Night normally begins 1 hour after sunset.
  // Evening is guaranteed to last at least 1 hour.
  const nightStart = Math.max(eveningStart + 60, sunsetMinutes + 60);

  if (mins < eveningStart) return "afternoon";
  if (mins < nightStart) return "evening";
  return "night";
}


function weatherClassFromWMO(code) {
  // Open-Meteo WMO weather interpretation codes.
  if ([71,73,75,77,85,86].includes(code)) return "snow";
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return "rain";
  if ([1,2,3,45,48].includes(code)) return "cloudy";
  if (code === 0) return "sunny";
  return "";
}

async function updateWeatherPreview(lat, lon) {
  const select = document.getElementById("weatherNow");
  if (!select) return;

  try {
    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}` +
      `&longitude=${encodeURIComponent(lon)}&current=weather_code&timezone=auto`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather request failed");
    const data = await response.json();
    const code = data?.current?.weather_code;
    const weather = weatherClassFromWMO(code);

    if (weather) {
      select.value = weather;
    } else {
      select.innerHTML = `<option value="">Weather unavailable</option>` + select.innerHTML;
      select.value = "";
    }
  } catch (e) {
    select.innerHTML = `<option value="">Weather unavailable</option>` + select.innerHTML;
    select.value = "";
  }
}

function getCurrentSunsetAndApply() {
  const d = new Date();

  const finish = () => {
    selectedSeasons.clear();
    for (const s of seasonNow(d)) selectedSeasons.add(s);
    document.getElementById("timeofday").value = timeNow(d);
    update();
  };

  if (!navigator.geolocation) {
    sunsetMinutes = null;
    finish();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      sunsetMinutes = sunsetLocalMinutes(d, lat, lon);
      updateWeatherPreview(lat, lon);
      finish();
    },
    () => {
      sunsetMinutes = null;
      const weatherSelect = document.getElementById("weatherNow");
      if (weatherSelect) {
        weatherSelect.innerHTML = `<option value="">Weather unavailable</option>` + weatherSelect.innerHTML;
        weatherSelect.value = "";
      }
      finish();
    },
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 3600000 }
  );
}

function applyNow() {
  getCurrentSunsetAndApply();
}

function passesBase(p) {
  const tod = document.getElementById("timeofday").value;
  if (selectedSeasons.size > 0 && ![...selectedSeasons].some(s => p["season"].includes(s))) return false;
  if (!p["time of day"].includes(tod)) return false;
  for (const [field] of optionalFields) {
    const v = optionalState[field];
    if (!v) continue;

    const fieldExistsInData = playlists.some(x => Array.isArray(x[field]) && x[field].length > 0);
    if (!fieldExistsInData) continue;

    if (!p[field].includes(v)) return false;
  }
  return true;
}

function passesGenres(p, extraGenre=null) {
  const required = new Set(selectedGenres);
  if (extraGenre) required.add(extraGenre);
  for (const g of required) if (!p["genres"].includes(g)) return false;
  return true;
}

function passesMoods(p) {
  if (selectedMoods.size === 0) return true;
  return [...selectedMoods].some(m => p["mood"].includes(m));
}

function resultRecords() {
  return playlists.filter(p => passesBase(p) && passesGenres(p) && passesMoods(p));
}

function addFilterGroup(containerId, fields) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  for (const [field,label] of fields) {
    const vals = [...new Set(playlists.flatMap(p => p[field]))].sort();
    const wrap = document.createElement("div");
    const lab = document.createElement("label");
    lab.textContent = label;
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">Any</option>` + vals.map(v => `<option value="${v}">${displayValue(field, v)}</option>`).join("");
    optionalSelects[field] = sel;
    sel.addEventListener("change", () => { optionalState[field] = sel.value; update(); });
    wrap.append(lab, sel);
    box.appendChild(wrap);
  }
}

function buildOptionalFilters() {
  addFilterGroup("settingFilters", settingFields);
  addFilterGroup("groupFilters", groupFields);
}

function renderSeasons() {
  const container = document.getElementById("seasonChips");
  const seasons = ["winter","spring","summer","fall"];
  container.innerHTML = "";
  for (const s of seasons) {
    const b = document.createElement("button");
    b.className = "chip" + (selectedSeasons.has(s) ? " selected" : "");
    b.textContent = titleCase(s);
    b.onclick = () => {
      selectedSeasons.has(s) ? selectedSeasons.delete(s) : selectedSeasons.add(s);
      update();
    };
    container.appendChild(b);
  }
}

function renderGenres() {
  const container = document.getElementById("genreChips");
  container.innerHTML = "";
  for (const g of sortByColorWheel(ALL_GENRES)) {
    // Genre availability responds to current moods + all currently selected genres.
    const count = playlists.filter(p =>
      passesBase(p) &&
      passesMoods(p) &&
      passesGenres(p, selectedGenres.has(g) ? null : g)
    ).length;
    if (count === 0 && !selectedGenres.has(g)) continue;

    const b = document.createElement("button");
    b.className = "chip" + (selectedGenres.has(g) ? " selected" : "");
    b.innerHTML = `${titleCase(g)} <span class="count">${count}</span>`;
    applyTagColor(b, g, selectedGenres.has(g));
    b.onclick = () => {
      selectedGenres.has(g) ? selectedGenres.delete(g) : selectedGenres.add(g);
      update();
    };
    container.appendChild(b);
  }
}

function renderMoods() {
  const container = document.getElementById("moodChips");
  container.innerHTML = "";

  // With OR mood logic, available moods are derived from base + genre filters.
  // Existing mood selections remain visible so they can always be deselected.
  for (const m of sortByColorWheel(ALL_MOODS)) {
    const count = playlists.filter(p =>
      passesBase(p) && passesGenres(p) && p["mood"].includes(m)
    ).length;
    if (count === 0 && !selectedMoods.has(m)) continue;

    const b = document.createElement("button");
    b.className = "chip" + (selectedMoods.has(m) ? " selected" : "");
    b.innerHTML = `${titleCase(m)} <span class="count">${count}</span>`;
    applyTagColor(b, m, selectedMoods.has(m));
    b.onclick = () => {
      selectedMoods.has(m) ? selectedMoods.delete(m) : selectedMoods.add(m);
      update();
    };
    container.appendChild(b);
  }
}

function renderResults() {
  let rows = resultRecords();
  const sort = document.getElementById("sort").value;

  if (sort === "az") {
    rows.sort((a,b) => a.name.localeCompare(b.name));
  } else {
    rows.sort((a,b) => {
      const am = [...selectedMoods].filter(m => a["mood"].includes(m)).length;
      const bm = [...selectedMoods].filter(m => b["mood"].includes(m)).length;
      if (bm !== am) return bm - am;
      return a.name.localeCompare(b.name);
    });
  }

  document.getElementById("resultCount").textContent = rows.length;
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No playlists match this combination. Remove a filter or genre.</div>`;
    return;
  }

  for (const p of rows) {
    const el = document.createElement(p.spotify ? "a" : "div");
    el.className = "card";
    if (p.spotify) {
      el.href = p.spotify;
      el.target = "_blank";
      el.rel = "noopener";
    }

    const img = p.cover
      ? `<img class="cover" src="${p.cover}" alt="" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="no-cover" style="display:none">No cover</div>`
      : `<div class="no-cover">No cover</div>`;

    const moodTags = p["mood"].map(m => {
      const [bg, fg] = colorForTag(m);
      return `<span class="tag" style="background:${bg};color:${fg}">${titleCase(m)}</span>`;
    }).join("");
    const spotify = p.spotify
      ? `<div class="spotify">Open in Spotify →</div>`
      : `<div class="spotify missing">Spotify link not added yet</div>`;

    el.innerHTML = `${img}<div class="card-body">
      <div class="name">${p.name}</div>
      <div class="tags">${moodTags}</div>
      ${spotify}
    </div>`;
    container.appendChild(el);
  }
}

function setOptionalFilter(field, value) {
  optionalState[field] = value || "";
  if (optionalSelects[field]) optionalSelects[field].value = value || "";
}

function setWithPeople(value) {
  withPeople = value === "yes";

  document.querySelectorAll("#peopleToggle .toggle-btn").forEach(btn => {
    btn.classList.toggle("selected", btn.dataset.value === value);
  });

  const wrap = document.getElementById("groupFiltersWrap");
  wrap.className = withPeople ? "group-visible" : "group-hidden";

  if (withPeople) {
    setOptionalFilter("emotional", "light");
    setOptionalFilter("cool", "cool");
    setOptionalFilter("sexual", "non-sexual");
  } else {
    for (const [field] of groupFields) setOptionalFilter(field, "");
  }

  update();
}

function updateTimeSummary() {
  const tod = document.getElementById("timeofday").value;
  const seasons = [...selectedSeasons].map(titleCase).join(" + ");
  document.getElementById("timeSummary").textContent =
    `${seasons} · ${titleCase(tod)}`;
}

function update() {
  updateTimeSummary();
  renderSeasons();
  renderMoods();
  renderGenres();   // Re-render again because current moods affect genre availability.
  renderResults();
}

document.getElementById("timeofday").addEventListener("change", update);
document.getElementById("sort").addEventListener("change", renderResults);
document.getElementById("useNow").addEventListener("click", applyNow);

buildOptionalFilters();

document.querySelectorAll("#peopleToggle .toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => setWithPeople(btn.dataset.value));
});

setWithPeople("no");
applyNow();
</script>
</body>
</html>
